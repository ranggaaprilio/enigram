# Workspace root, with no package of its own: each app under apps/ with a pyproject.toml is a
# member. One uv.lock and one .venv (here) cover them all, so `uv run enigram ...` works from the
# repository root, where .env, data/ and eval/ live.
[tool.uv.workspace]
members = ["apps/api"]

# Repository-wide tools; each member lists its own test dependencies.
[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]

# Here, not in apps/api, so a bare `uv run pytest` at the root finds it (pytest also finds it from
# inside apps/api, searching upwards).
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
markers = [
    "docling: needs Docling layout models (slow, downloads once)",
    "live: needs DEEPSEEK_API_KEY and VOYAGE_API_KEY (calls the paid APIs)",
    "postgres: needs a Postgres reachable at ENIGRAM_TEST_PG_DSN",
]

# Ruff reads this for every Python file in the repository (members define no [tool.ruff]).
[tool.ruff]
line-length = 100
# First-party packages for import sorting: one source root per member.
src = [".", "apps/api/src"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
