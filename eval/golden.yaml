# Code golden set v2 (Enigram Code Knowledge PRD, Phase 0). Check: uv run enigram golden check
# Format, lock, labelling protocol and change log: eval/README.md.
#
# Every answer key holds at repo.pinned_sha. Answers state behaviour visible statically in the
# code; values that come from the environment are named by their variable, never guessed.
# "# class:" comments group questions for the split; they are not read by the loader.
#
# Drafted by Claude from the code at the pinned commit, reviewed by the owner and locked
# 2026-11-01. eval-v1 = upstream 9620f159 + the injection fixture commit.
version: 2
repo:
  url: https://github.com/ranggaaprilio/nestjs-boilerplate
  ref: eval-v1
  pinned_sha: "70ae60dbb6090ef75009845a914a140a2a5b9f30"
  upstream_sha: "9620f159eefe38f47747d02ab162852367c5472c"  # informational, ignored by the loader
questions:
  # ================================================================ behavior: auth-email
  - id: "b01"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: graph_flow
    in_docs: true
    question: "What does the API answer when someone logs in with an email address that has no account?"
    answer: >
      422 Unprocessable Entity with errors {email: "notFound"}. When AUTH_UNIFORM_ERRORS is
      true it instead returns {email: "incorrectEmailOrPassword", password:
      "incorrectEmailOrPassword"}, so the response does not reveal whether the email exists.
    evidence:
      - symbol: AuthService.validateLogin
      - symbol: AuthService.invalidLoginException

  - id: "b02"  # class: auth-email
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "A user signed up with Google. What happens if they try to log in with email and password?"
    answer: >
      Login is rejected with 422: validateLogin finds the user by email, sees that its provider is
      not "email" and returns errors {email: "needLoginViaProvider:google"} (or the uniform
      incorrectEmailOrPassword error when AUTH_UNIFORM_ERRORS is true).
    evidence:
      - symbol: AuthService.validateLogin

  - id: "b03"  # class: auth-email
    category: behavior
    split: dev
    expected_route: graph_flow
    question: "Can a user who registered but never confirmed their email log in with email and password?"
    answer: >
      Yes. validateLogin only checks that the user exists, uses the email provider and that the
      bcrypt password matches; it never looks at the status, so an inactive (unconfirmed) user
      gets a session and tokens like anyone else.
    evidence:
      - symbol: AuthService.validateLogin

  - id: "b04"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What does a successful email login return, and what is inside the two tokens?"
    answer: >
      token, refreshToken, tokenExpires and the user. The access token carries id, role and
      sessionId and is signed with AUTH_JWT_SECRET for AUTH_JWT_TOKEN_EXPIRES_IN; the refresh token
      carries sessionId and the session hash and is signed with AUTH_REFRESH_SECRET for
      AUTH_REFRESH_TOKEN_EXPIRES_IN. tokenExpires is now plus the access token lifetime in ms.
    evidence:
      - symbol: AuthService.getTokensData
      - symbol: AuthService.validateLogin

  - id: "b05"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What happens when someone registers with email and password?"
    answer: >
      A user is created with role user and status inactive and a bcrypt-hashed password. A JWT
      with confirmEmailUserId, signed with AUTH_CONFIRM_EMAIL_SECRET, is mailed as a link to
      FRONTEND_DOMAIN/confirm-email?hash=…; the endpoint answers 204 with no body and no tokens.
    evidence:
      - symbol: AuthService.register
      - symbol: MailService.userSignUp
      - symbol: UsersService.create

  - id: "b06"  # class: auth-email
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "What happens when someone tries to register with an email that already has an account?"
    answer: >
      UsersService.create finds the existing email and throws 422 with errors {email:
      "emailAlreadyExists"}; no user is created and no mail is sent.
    evidence:
      - symbol: UsersService.create
      - symbol: AuthService.register

  - id: "b07"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: semantic
    question: "What rules apply to the email and password fields at registration?"
    answer: >
      The email must be a valid email and is lower-cased and trimmed before use; the password
      needs at least 6 characters; first and last name must not be empty. Violations come back
      as 422 with field-level messages.
    evidence:
      - symbol: AuthRegisterLoginDto
      - symbol: lowerCaseTransformer

  - id: "b08"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What happens when a confirm-email link is used twice?"
    answer: >
      The first use sets the status to active. The second use verifies the same hash but the user
      is no longer inactive, so it fails with 404 {error: "notFound"}. An invalid or expired hash
      fails earlier with 422 {hash: "invalidHash"}.
    evidence:
      - symbol: AuthService.confirmEmail

  - id: "b09"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: graph_flow
    in_docs: true
    question: "What does forgot-password do for an email that is not registered?"
    answer: >
      By default it throws 422 {email: "emailNotExists"}. With AUTH_UNIFORM_ERRORS=true it returns
      silently (204) without sending anything, exactly like the success case.
    evidence:
      - symbol: AuthService.forgotPassword

  - id: "b10"  # class: auth-email
    category: behavior
    split: reserve
    expected_route: docs
    in_docs: true
    question: "Why can a password reset link only be used once, even though nothing is stored?"
    answer: >
      The reset JWT is signed with AUTH_FORGOT_SECRET concatenated with the user's current
      password hash. Once the password changes the secret changes, so the old link no longer
      verifies.
    evidence:
      - symbol: AuthService.getForgotSecret
      - symbol: AuthService.resetPassword

  - id: "b11"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: graph_flow
    in_docs: true
    question: "What happens to a user's logged-in devices when they reset their password?"
    answer: >
      After the reset hash verifies, every session of the user is deleted (deleteByUserId) and
      the new password is saved hashed. All refresh tokens stop working; access tokens already
      issued stay valid until they expire.
    evidence:
      - symbol: AuthService.resetPassword
      - symbol: SessionService.deleteByUserId

  - id: "b12"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "How does changing the password through PATCH /auth/me work?"
    answer: >
      password requires oldPassword: missing gives 422 {oldPassword: "missingOldPassword"}, a
      wrong one (or an account without a password) gives "incorrectOldPassword". When it matches,
      all other sessions of the user are deleted but the current session is kept, then the new
      password is hashed and saved.
    evidence:
      - symbol: AuthService.update
      - symbol: SessionService.deleteByUserIdWithExclude

  - id: "b13"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What happens when a user changes their email through PATCH /auth/me?"
    answer: >
      The email is not changed right away. If another user has it, 422 {email: "emailExists"};
      otherwise a JWT with confirmEmailUserId and newEmail is mailed to the new address and the
      email field is dropped from the update. The change applies only when /auth/email/confirm/new
      is called with that hash.
    evidence:
      - symbol: AuthService.update
      - symbol: AuthService.confirmNewEmail
      - symbol: MailService.confirmNewEmail

  - id: "b14"  # class: auth-email
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "Does confirming a new email address change anything besides the email?"
    answer: >
      Yes: confirmNewEmail sets the status to active unconditionally, so a user who was inactive
      (unconfirmed or deactivated) becomes active when the new-email link is followed.
    evidence:
      - symbol: AuthService.confirmNewEmail

  - id: "b15"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What happens when a user deletes their own account with DELETE /auth/me?"
    answer: >
      usersService.remove is called: soft delete (deletedAt) with Postgres, a hard delete with
      MongoDB. Sessions are not deleted, and the access token keeps working until it expires.
    evidence:
      - symbol: AuthService.softDelete
      - symbol: UsersRelationalRepository.remove
      - symbol: UsersDocumentRepository.remove

  - id: "b16"  # class: auth-email
    category: behavior
    split: verdict
    expected_route: graph_flow
    in_docs: true
    question: "After logout, can the old access token and refresh token still be used?"
    answer: >
      Logout deletes only the current session. The refresh token stops working because its
      session is gone; the access token stays valid until AUTH_JWT_TOKEN_EXPIRES_IN, because the
      JWT strategy never checks the session.
    evidence:
      - symbol: AuthService.logout
      - symbol: JwtStrategy.validate

  # ============================================================ behavior: session-refresh
  - id: "b17"  # class: session
    category: behavior
    split: dev
    expected_route: graph_flow
    in_docs: true
    question: "Walk through POST /auth/refresh: what is checked and what is returned?"
    answer: >
      The jwt-refresh strategy verifies the bearer token with AUTH_REFRESH_SECRET (HS256) and
      requires a sessionId. refreshToken then updates the session's hash only where id and the
      token's hash both match; no match gives 401. The user must still exist with a role (else
      401). It returns a new token, refreshToken and tokenExpires, without the user.
    evidence:
      - symbol: AuthService.refreshToken
      - symbol: JwtRefreshStrategy.validate
      - symbol: SessionService.updateByHash

  - id: "b18"  # class: session
    category: behavior
    split: verdict
    expected_route: graph_flow
    in_docs: true
    question: "What happens if a client sends a refresh token it has already used once?"
    answer: >
      401 Unauthorized. The first refresh replaced the session hash, so updateByHash finds no
      session with the old hash and returns null.
    evidence:
      - symbol: AuthService.refreshToken
      - symbol: SessionRelationalRepository.updateByHash

  - id: "b19"  # class: session
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "If an admin changes a user's role, when does the user's access token reflect it?"
    answer: >
      Only after the next refresh: refreshToken reads the user's current role id from the
      database for the new access token. Until then the old token keeps the old role.
    evidence:
      - symbol: AuthService.refreshToken

  - id: "b20"  # class: session
    category: behavior
    split: verdict
    expected_route: graph_flow
    confidence: low
    question: "Can a user whose account was soft-deleted still refresh their tokens?"
    answer: >
      No (with Postgres): findById does not return soft-deleted rows, so refreshToken finds no
      user with a role and answers 401.
    evidence:
      - symbol: AuthService.refreshToken
      - symbol: UsersRelationalRepository.findById

  - id: "b21"  # class: session
    category: behavior
    split: verdict
    expected_route: graph_flow
    in_docs: true
    question: "Does every authenticated request check that the user still exists?"
    answer: >
      No. The jwt strategy only verifies the signature with AUTH_JWT_SECRET and that the payload
      has an id; request.user is the token payload. Deleted or logged-out users keep access until
      the token expires.
    evidence:
      - symbol: JwtStrategy.validate

  - id: "b22"  # class: session
    category: behavior
    split: reserve
    expected_route: graph_flow
    in_docs: true
    question: "Can one user be logged in on several devices at once?"
    answer: >
      Yes. Every login (email or social) creates a new session with its own random hash, so
      sessions are independent and each device refreshes its own.
    evidence:
      - symbol: AuthService.validateLogin
      - symbol: SessionService.create

  - id: "b23"  # class: di
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "Is a session row really removed on logout?"
    answer: >
      It depends on the database: the relational repository soft-deletes it (sets deletedAt),
      the MongoDB repository deletes the document.
    evidence:
      - symbol: SessionRelationalRepository.deleteById
      - symbol: SessionDocumentRepository.deleteById

  # ===================================================================== behavior: roles
  - id: "b24"  # class: roles
    category: behavior
    split: dev
    expected_route: graph_flow
    question: "Who may call the /users endpoints, and what does a normal user get?"
    answer: >
      Only admins: the controller requires a valid JWT and RolesGuard with @Roles(admin). A user
      with role user gets 403 Forbidden; no token gives 401.
    evidence:
      - symbol: UsersController
      - symbol: RolesGuard.canActivate

  - id: "b25"  # class: roles
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What does RolesGuard do on a route that has no @Roles decorator?"
    answer: "It allows the request: with no roles metadata on the class or handler it returns true."
    evidence:
      - symbol: RolesGuard.canActivate

  - id: "b26"  # class: roles
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "Where does RolesGuard get the user's role from?"
    answer: >
      From request.user, which is the access-token payload, not from the database. A demoted
      admin keeps admin rights until the token expires or is refreshed.
    evidence:
      - symbol: RolesGuard.canActivate
      - symbol: AuthService.getTokensData

  - id: "b27"  # class: roles
    category: behavior
    split: verdict
    expected_route: symbol
    question: "Which role and status ids exist?"
    answer: "Roles: admin = 1, user = 2. Statuses: active = 1, inactive = 2."
    evidence:
      - symbol: RoleEnum
      - symbol: StatusEnum

  # ===================================================================== behavior: users
  - id: "b28"  # class: users
    category: behavior
    split: dev
    expected_route: graph_flow
    question: "How does pagination work on GET /users?"
    answer: >
      page defaults to 1 and limit to 10, and limit is capped at 50. The response is {data,
      hasNextPage}, where hasNextPage is true when the page came back full (data.length ===
      limit), so a last page of exactly limit items still reports a next page.
    evidence:
      - symbol: UsersController.findAll
      - symbol: infinityPagination

  - id: "b29"  # class: users
    category: behavior
    split: verdict
    expected_route: semantic
    question: "How can an admin filter and sort the list of users?"
    answer: >
      filters and sort are query parameters holding JSON: filters {roles: [{id}]} keeps users with
      one of those roles; sort is a list of {orderBy, order}.
    evidence:
      - symbol: QueryUserDto
      - symbol: UsersRelationalRepository.findManyWithPagination

  - id: "b30"  # class: users
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What happens when an admin creates a user with a role id that does not exist?"
    answer: >
      422 {role: "roleNotExists"}. The same check gives "statusNotExists" for an unknown status
      and "imageNotExists" when the photo id is not a stored file.
    evidence:
      - symbol: UsersService.create

  - id: "b31"  # class: users
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "What provider does a user created by an admin get?"
    answer: >
      "email", unless the payload sets another provider; the password, when given, is hashed
      with bcrypt.
    evidence:
      - symbol: UsersService.create

  - id: "b32"  # class: users
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What happens when an admin updates a user's email to one another user already has?"
    answer: >
      422 {email: "emailAlreadyExists"}. Setting the user's own current email is allowed, and
      sending email: null clears it.
    evidence:
      - symbol: UsersService.update

  - id: "b33"  # class: users
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "When does UsersService.update hash the password it is given?"
    answer: >
      When a password is given and it differs from the stored hash string; it is then hashed with
      a new bcrypt salt. A value equal to the stored hash is left unchanged.
    evidence:
      - symbol: UsersService.update

  - id: "b34"  # class: di
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "Does DELETE /users/{id} remove the user permanently?"
    answer: >
      With Postgres no: the relational repository soft-deletes (deletedAt). With MongoDB yes: the
      document repository deletes the document. Either way the answer is 204.
    evidence:
      - symbol: UsersController.remove
      - symbol: UsersRelationalRepository.remove
      - symbol: UsersDocumentRepository.remove

  - id: "b35"  # class: serialization
    category: behavior
    split: reserve
    expected_route: semantic
    in_docs: true
    question: "Which user fields are hidden from API responses?"
    answer: >
      password is never serialized. email, provider and socialId are only included for the
      serialization groups me or admin (the auth me/login endpoints and the admin users
      endpoints); elsewhere they are left out.
    evidence:
      - symbol: User
        file: src/users/domain/user.ts

  - id: "b36"  # class: serialization
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "Does the login response include the user's email?"
    answer: >
      Yes: the login endpoints use @SerializeOptions groups ['me'], which exposes email, provider
      and socialId; the password is still excluded.
    evidence:
      - symbol: AuthController.login
      - symbol: User
        file: src/users/domain/user.ts

  # ==================================================================== behavior: social
  - id: "b37"  # class: social
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What happens on POST /auth/google/login?"
    answer: >
      The idToken is verified with Google for GOOGLE_CLIENT_ID. No payload gives 422 {user:
      "wrongToken"}; an email that Google has not verified gives 422 {email: "emailNotVerified"}.
      Otherwise the profile goes to validateSocialLogin("google"), which returns tokens and the
      user.
    evidence:
      - symbol: AuthGoogleController.login
      - symbol: AuthGoogleService.getProfileByToken
      - symbol: AuthService.validateSocialLogin

  - id: "b38"  # class: social
    category: behavior
    split: dev
    expected_route: graph_flow
    question: "What happens the first time someone logs in with a social provider and no account matches?"
    answer: >
      A new user is created with role user, status active, the provider and social id, the
      lower-cased email (or null) and the provider's names. Then a session and tokens are issued
      as for an email login.
    evidence:
      - symbol: AuthService.validateSocialLogin

  - id: "b39"  # class: social
    category: behavior
    split: verdict
    expected_route: graph_flow
    in_docs: true
    question: "A social login matches, by email, an account that registered with a password but never confirmed it. What happens?"
    answer: >
      The account's provider and socialId are moved to the social identity and it is logged in;
      the status stays inactive. Password login stops working afterwards because validateLogin
      rejects non-email providers. This prevents account pre-hijacking.
    evidence:
      - symbol: AuthService.validateSocialLogin
      - symbol: AuthService.validateLogin

  - id: "b40"  # class: social
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "A social login matches, by email, an active account that uses email and password. Is the social identity linked to it?"
    answer: >
      No. The user is logged into that account, but provider and socialId are only changed for
      inactive accounts, so the active account keeps provider email and no social id is stored.
    evidence:
      - symbol: AuthService.validateSocialLogin

  - id: "b41"  # class: social
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "Can a social account without an email address log in?"
    answer: >
      Yes. The user is looked up by social id and provider; if none exists a user is created with
      email null. A user is only refused (422 {user: "userNotFound"}) when there is neither a
      matching account nor a social id.
    evidence:
      - symbol: AuthService.validateSocialLogin

  - id: "b42"  # class: social
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "How does the Facebook login check the access token, and what errors can it return?"
    answer: >
      It calls Facebook's debug_token with FACEBOOK_APP_ID|FACEBOOK_APP_SECRET (5 s timeout) and
      requires the token to be valid and issued for that app, then reads /me (10 s timeout).
      Missing app credentials give 500, a timeout 408, an invalid token 401, and a profile without
      id 400.
    evidence:
      - symbol: AuthFacebookService.getProfileByToken
      - symbol: AuthFacebookService.verifyAccessToken

  - id: "b43"  # class: social
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "Does the Facebook login check that the user's email is verified?"
    answer: >
      No. It reports emailVerified = Boolean(email), so any email Facebook returns counts as
      verified and can match an existing account by email.
    evidence:
      - symbol: AuthFacebookService.getProfileByToken

  - id: "b44"  # class: social
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "Where do first and last name come from on an Apple login?"
    answer: >
      From the request body (loginDto.firstName/lastName), not from the Apple token. The token
      supplies sub and email; email_verified counts as verified when it is true or the string
      "true".
    evidence:
      - symbol: AuthAppleService.getProfileByToken

  - id: "b45"  # class: social
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "When a returning social user's provider email changed, is the stored email updated?"
    answer: >
      Only if no account already uses the new email: the user found by social id gets the new
      lower-cased email when findByEmail returns nothing; the user is saved either way.
    evidence:
      - symbol: AuthService.validateSocialLogin

  # ===================================================================== behavior: files
  - id: "b46"  # class: files
    category: behavior
    split: verdict
    expected_route: graph_flow
    in_docs: true
    question: "How is the file storage driver chosen?"
    answer: >
      From FILE_DRIVER (local, s3 or s3-presigned), defaulting to local. FilesModule picks the
      matching uploader module once, when the module is loaded at startup.
    evidence:
      - symbol: FilesModule

  - id: "b47"  # class: files
    category: behavior
    split: dev
    expected_route: graph_flow
    question: "With the local driver, what limits apply to POST /files/upload and where is the file stored?"
    answer: >
      A JWT is required. Only names ending in jpg, jpeg, png or gif are accepted (else 422 {file:
      "cantUploadFileType"}), up to 5 MB, a value fixed in code rather than read from the
      environment. The file is written to ./files under a random name and recorded with path
      /<API_PREFIX>/v1/<file path>.
    evidence:
      - symbol: FilesLocalModule
      - symbol: FilesLocalService.create
      - symbol: FilesLocalController.uploadFile

  - id: "b48"  # class: files
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What happens when the upload request has no file?"
    answer: "422 {file: \"selectFile\"} (local and s3 drivers)."
    evidence:
      - symbol: FilesLocalService.create
      - symbol: FilesS3Service.create

  - id: "b49"  # class: files
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "Do you need to be logged in to download a locally stored file?"
    answer: >
      No. GET /files/{path} has no guard and sends the file from ./files; it is also hidden from
      Swagger. Only uploading requires a JWT.
    evidence:
      - symbol: FilesLocalController.download

  - id: "b50"  # class: files
    category: behavior
    split: verdict
    expected_route: graph_flow
    in_docs: true
    question: "How does an upload work with the s3-presigned driver?"
    answer: >
      The client posts fileName and fileSize. The server checks the extension (422
      cantUploadFileType) and size (413 above 5 MB), stores a file record whose path is a random
      key, and returns it with a PUT URL signed for one hour; the client uploads to S3 itself.
    evidence:
      - symbol: FilesS3PresignedService.create
      - symbol: FilesS3PresignedController.uploadFile

  - id: "b51"  # class: files
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "What URL does a file's path field contain in API responses?"
    answer: >
      With the local driver, BACKEND_DOMAIN followed by the stored path. With s3 or s3-presigned,
      a GET URL for the stored key, signed for one hour, created each time the file is
      serialized.
    evidence:
      - symbol: FileType

  - id: "b52"  # class: serialization
    category: behavior
    split: reserve
    expected_route: docs
    question: "Why does the app register ResolvePromisesInterceptor before ClassSerializerInterceptor?"
    answer: >
      class-transformer cannot resolve promises, and some serialized values are promises (the S3
      signed file URL). The interceptor deep-resolves promises in every response before
      serialization.
    evidence:
      - symbol: ResolvePromisesInterceptor
      - symbol: deepResolvePromises
      - symbol: bootstrap

  - id: "b53"  # class: users
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "How does a user set or remove their profile photo?"
    answer: >
      Upload the file first, then PATCH /auth/me with photo {id}. The id must belong to a stored
      file (else 422 {photo: "imageNotExists"}); photo: null removes it.
    evidence:
      - symbol: AuthService.update
      - symbol: UsersService.update

  # ====================================================================== behavior: mail
  - id: "b54"  # class: mail
    category: behavior
    split: dev
    expected_route: graph_flow
    question: "What link does the forgot-password email contain?"
    answer: >
      FRONTEND_DOMAIN/password-change with query parameters hash (the reset JWT) and expires (the
      expiry time in ms since epoch), rendered with the reset-password.hbs template.
    evidence:
      - symbol: MailService.forgotPassword
      - symbol: AuthService.forgotPassword

  - id: "b55"  # class: mail
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "How are emails sent, and from which address?"
    answer: >
      Through nodemailer SMTP using the MAIL_* settings (port 587 by default). Templates are
      Handlebars in strict mode. The sender defaults to "MAIL_DEFAULT_NAME" <MAIL_DEFAULT_EMAIL>
      unless a from is given.
    evidence:
      - symbol: MailerService.sendMail

