    setup:
      annotation:
        target: AuthService.logout
        text: "Logout immediately invalidates the access token."
    # Deliberately contradicts the code: the answer must show both as a conflict (Phase 2).
    question: "Does logout immediately invalidate the access token?"
    answer: >
      Conflict. The code deletes only the session, and the jwt strategy never checks sessions, so
      the access token stays valid until it expires; the team note claims it is invalidated
      immediately. Both should be shown, with the code fact marked as such.
    evidence:
