  - id: "b67"  # class: errors
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "What happens when a client calls POST /auth/refresh with the access token instead of the refresh token?"
    answer: >
      401: the jwt-refresh strategy verifies the token with AUTH_REFRESH_SECRET, and the access
      token is signed with AUTH_JWT_SECRET, so the signature check fails.
    evidence:
