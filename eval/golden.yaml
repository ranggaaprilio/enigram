  # ======================================================================= behavior: di
  - id: "b63"  # class: di
    category: behavior
    split: dev
    expected_route: graph_flow
    in_docs: true
    question: "How does the app decide between Postgres and MongoDB?"
    answer: >
      DATABASE_TYPE: "mongodb" makes the config report a document database. AppModule then
      connects with Mongoose, and each feature module imports its document persistence module;
      any other type uses TypeORM and the relational modules. The choice is made when modules
      load.
    evidence:
      - symbol: AppModule
      - symbol: UsersModule

  - id: "b64"  # class: di
    category: behavior
    split: verdict
    expected_route: graph_flow
    question: "Which class actually runs when UsersService calls usersRepository.findByEmail?"
    answer: >
      UsersService depends on the abstract UserRepository; the persistence module chosen by the
      database type binds it to UsersRelationalRepository (TypeORM) or UsersDocumentRepository
      (Mongoose). Both return null for an empty email.
    evidence:
      - symbol: UsersService.findByEmail
      - symbol: UsersRelationalRepository.findByEmail
      - symbol: UsersDocumentRepository.findByEmail

  - id: "b65"  # class: di
    category: behavior
    split: reserve
    expected_route: graph_flow
    question: "Does sorting the user list behave the same on Postgres and MongoDB?"
    answer: >
      Not exactly. The document repository maps orderBy id to _id and turns order "ASC" (any
      case) into ascending, anything else descending. The relational repository passes orderBy
      and order to TypeORM unchanged.
    evidence:
      - symbol: UsersDocumentRepository.findManyWithPagination
      - symbol: UsersRelationalRepository.findManyWithPagination

  - id: "b66"  # class: di
    category: behavior
    split: verdict
    expected_route: symbol
    question: "What type is a user id in the API?"
    answer: "A number with Postgres and a string with MongoDB; the User domain picks it from the database config."
    evidence:
      - symbol: User
        file: src/users/domain/user.ts

