  # ================================================================ server config
  - id: "u42"   # class: config
    category: behavior
    split: dev
    expected_route: symbol
    confidence: high
    question: "What does MCP_ENABLED turn on, and how does a client authenticate to /mcp?"
    answer: >
      Unless MCP_ENABLED is "1", /mcp answers 404. Requests need a bearer API key (umami_...,
      unavailable in CLOUD_MODE); a missing or invalid key gets 401 with a WWW-Authenticate header.
      The MCP server then calls the normal API route handlers in-process with that key, so the
      usual permission checks apply.
    evidence:
      - symbol: handle
        file: src/app/mcp/route.ts
      - symbol: authenticateMcpRequest
        file: src/lib/mcp/auth.ts

  - id: "u43"   # class: config
    category: behavior
    split: dev
    expected_route: symbol
    confidence: high
    question: "How does ALLOWED_FRAME_URLS let me embed the Umami dashboard in an iframe on another site?"
    answer: >
      Its value is appended to the Content-Security-Policy frame-ancestors directive after 'self';
      without it only same-origin framing is allowed. API_URL's origin is likewise added to
      connect-src. A normal Next build reads it at build time; the Docker image computes the policy
      once when the container starts, so a change needs a restart, not a rebuild.
    evidence:
      - symbol: getContentSecurityPolicy
        file: src/lib/csp.ts
