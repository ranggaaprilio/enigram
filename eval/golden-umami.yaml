  - id: "u25"   # class: replay
    category: behavior
    split: dev
    expected_route: symbol
    confidence: high
    question: "What does /api/record check before it saves session replay or heatmap data?"
    answer: >
      Bodies over 1,000,000 bytes get 413; a body holds at most 200 events. It needs an
      x-umami-cache token issued by /api/send for the same website (400 otherwise), the website's
      recorderEnabled flag, and in CLOUD_MODE an unblocked business or no-billing account (403).
      Bots and blocked IPs are refused. "record" chunks are saved only when replayEnabled is set in
      the website's replay config, "heatmap" clicks/scrolls only when heatmapEnabled is set.
    evidence:
      - symbol: POST
        file: src/app/api/record/route.ts
      - symbol: getRecorderConfig
        file: src/lib/recorder.ts

  # ================================================================ error tracking
  - id: "u26"   # class: errors
    category: behavior
    split: dev
    expected_route: graph_flow
    confidence: high
    question: "What happens when a JavaScript error from a visitor's browser is reported to Umami?"
    answer: >
      The collect endpoint routes type "error" to its own path: bodies over 48000 bytes get 413, a
      missing or deleted website or a timestamp more than 5 minutes ahead (or before resetAt) gets
      400, bots are ignored and blocked IPs get 403, and each website may send ERRORS_PER_MINUTE (default
      120) errors per minute before 429 with Retry-After 60 (counted in a Postgres table). The
      error is normalized and grouped by a fingerprint into an issue, then the issue and event rows
      are written (event to ClickHouse when it is enabled).
    evidence:
      - symbol: collectError
        file: src/lib/errors/collect.ts
      - symbol: consumeErrorQuota
        file: src/queries/sql/errors/store.ts
      - symbol: saveError
        file: src/queries/sql/errors/store.ts

  # ================================================================ reports
  - id: "u27"   # class: reports
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "How is a saved funnel stored, and how are its conversion numbers worked out?"
    answer: >
      A funnel is a report row of type "funnel" with its steps and window as parameters. Its stats
      reload that report and count distinct sessions per step: step 1 matches a page path or event
      name (a * acts as a wildcard), and each later step must happen in the same session within
      "window" minutes after the previous step. Each step returns visitors, previous, dropped,
      dropoff (1 - visitors/previous) and remaining (visitors/first step).
    evidence:
      - symbol: GET
        file: src/app/api/websites/[websiteId]/funnels/[funnelId]/stats/route.ts
      - symbol: getFunnel
        file: src/queries/sql/funnels/getFunnel.ts

  - id: "u28"   # class: reports
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "How is the retention table calculated: what is a cohort and what does the percentage mean?"
    answer: >
      A session's cohort is the first day (in the requested timezone) it had an event in the date
      range. For each cohort day and each day number after it (up to day 31) it counts sessions
      active again; percentage is those return visitors * 100 / the cohort size. Same logic for
      Postgres and ClickHouse.
    evidence:
      - symbol: getRetention
        file: src/queries/sql/retention/getRetention.ts

  - id: "u29"   # class: reports
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "In the attribution report, what is the difference between the first-click and last-click models?"
    answer: >
      Both start from sessions that hit the conversion step (a page path or event name) in the date
      range. First-click credits the session's earliest event in the range; otherwise (last-click)
      it credits the latest event before the session's last conversion. Referrer, paid ads (click
      ids) and UTM values of that event are counted as distinct sessions, top 20 each.
    evidence:
      - symbol: getAttribution
        file: src/queries/sql/attribution/getAttribution.ts

  # ================================================================ realtime
  - id: "u30"   # class: realtime
    category: behavior
