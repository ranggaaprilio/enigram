  # ================================================================ data handling
  - id: "u15"   # class: data
    category: behavior
    split: dev
    expected_route: graph_flow
    confidence: high
    question: "What gets removed when a website is deleted, and is it really gone or just hidden?"
    answer: >
      After the delete permission check (401 otherwise), one Prisma transaction deletes the
      website's events, sessions, event/session data, replays, heatmaps, revenue and error rows,
      plus its reports, segments, annotations and shares. The website row is hard-deleted, except
      in CLOUD_MODE where deletedAt is set; the Redis entry website:<id> is dropped. Only Prisma
      tables are cleared: on a ClickHouse setup the events stay.
    evidence:
      - symbol: deleteWebsite
        file: src/queries/prisma/website.ts
      - symbol: deleteWebsiteDependentData
        file: src/queries/prisma/website.ts
      - symbol: DELETE
        file: src/app/api/websites/[websiteId]/route.ts

  - id: "u16"   # class: data
    category: behavior
    split: dev
    expected_route: graph_flow
    confidence: high
    question: "What does resetting a website's data do, and who is allowed to do it?"
    answer: >
      Anyone allowed to update the website (else 401) can reset it. The reset deletes all
      collected data (events, sessions, event/session data, replays, heatmaps, revenue, errors)
      but keeps the website, its reports, segments and shares, sets resetAt to now, and rewrites
      the website into Redis when enabled. Only Prisma tables are cleared: on a ClickHouse setup
      the events stay.
    evidence:
