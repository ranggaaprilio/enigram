    expected_route: semantic
    confidence: high
    question: "Who counts as a visitor online right now, and how much time does the realtime page cover?"
    answer: >
      The active-visitors number is the count of distinct sessions with any event in the last 5
      minutes. The realtime view covers the last 30 minutes (REALTIME_RANGE, from the start of the
      current minute) and returns pageview/visitor series, totals, and counts by country, URL and
      referrer. A board share gets the aggregates but an empty event list.
    evidence:
