  # ================================================================ identify & event data
  - id: "u21"   # class: identify
    category: behavior
    split: dev
    expected_route: graph_flow
    confidence: high
    question: "What happens when the tracker identifies a visitor with my own user id and some profile fields?"
    answer: >
      An "identify" hit with a website and distinct id links the session to that id (session_link
      row, duplicates ignored) and sets the session's distinct id; a failure there is only logged.
      The cache token carries the link id, so repeat identify calls with the same id skip that
      write. The profile fields are flattened and saved as session data; on Postgres each key is
      upserted per (session_id, data_key), so a newer value replaces the old one.
    evidence:
      - symbol: POST
        file: src/app/api/send/route.ts
      - symbol: saveSessionData
        file: src/queries/sql/sessions/saveSessionData.ts
      - symbol: saveSessionLink
        file: src/queries/sql/sessions/saveSessionLink.ts

  - id: "u22"   # class: event-data
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "How are the custom properties attached to a tracked event stored, especially nested objects and arrays?"
    answer: >
      The properties are flattened: nested objects become dot-separated keys (a.b), arrays are
      stored as a JSON string with type array, booleans as "true"/"false", ISO-like date strings as
      dates, and numbers also as a 4-decimal string. Keys and string values are cut to 500 chars
      (an array string longer than that is stored as null). Each key is one row in event_data linked to
      the event (Prisma on Postgres; on ClickHouse an insert or the Kafka topic event_data).
    evidence:
      - symbol: saveEventData
        file: src/queries/sql/events/saveEventData.ts
      - symbol: flattenJSON
        file: src/lib/data.ts

