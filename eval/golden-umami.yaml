    expected_route: graph_flow
    confidence: high
    question: "What happens when an email client loads one of my tracking pixel images?"
    answer: >
      GET /p/<slug> finds the non-deleted pixel by slug (Redis key pixel:<slug>, 86400 seconds,
      when Redis is enabled; 404 if missing), sends an "event" payload with the pixel id, URL and
      referer through the /api/send handler (saved as a pixel event, type 4), and returns a 1x1
      GIF with no-cache headers.
    evidence:
