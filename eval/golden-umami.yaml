  - id: "u10"   # class: auth
    category: behavior
    split: dev
    expected_route: graph_flow
    confidence: high
    question: "If I change my password, are the sessions that were already logged in kicked out?"
    answer: >
      Yes for tokens that carry a password fingerprint: the session stores a hash of the password
      hash (pwd), and on every request the auth check compares it with the current one and treats
      the request as unauthenticated on mismatch, for both stateless tokens and Redis sessions.
      Legacy tokens without pwd are still accepted.
    evidence:
      - symbol: checkAuth
        file: src/lib/auth.ts
      - symbol: createSessionToken
        file: src/lib/auth.ts

  - id: "u11"   # class: rate-limit
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "What stops someone from brute-forcing the six-digit two-factor code?"
    answer: >
      Each verify attempt is counted before the code is checked, in a serializable transaction.
      At 5 attempts the user is locked for 15 minutes and further attempts get 429
      two-factor-error-too-many-attempts with lockedUntil; a successful code clears the counter.
    evidence:
      - symbol: reserveAttempt
        file: src/lib/two-factor/rate-limit.ts
      - symbol: POST
        file: src/app/api/2fa/verify/route.ts

