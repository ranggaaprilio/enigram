  # ================================================================ query parameters
  - id: "u31"   # class: dates
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "If I ask for hourly buckets on a three-month date range, which time unit does the API actually use?"
    answer: >
      Daily. The smallest unit allowed comes from the range: up to 60 minutes is minute, up to 30
      days is hour, up to 7 calendar months is day, up to 24 months is month, else year. A
      requested unit is kept only if it is that unit or coarser (over 24 months, month is still
      allowed); otherwise the smallest allowed unit is used.
    evidence:
      - symbol: getRequestDateRange
        file: src/lib/request.ts
      - symbol: getMinimumUnit
        file: src/lib/date.ts
      - symbol: getAllowedUnits
        file: src/lib/date.ts

  - id: "u32"   # class: filters
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "How does a filter in the dashboard URL like browser=neq.chrome,firefox turn into a SQL condition?"
    answer: >
      Only query keys whose name (minus a numeric suffix) is a known filter column are kept. The
      value is split into "<operator>.<value>", eq by default, and eq/neq values are split on
      commas. On Postgres eq becomes = ANY(...), neq coalesce(col, '') != ALL(...), c ilike
      %value% and dnc coalesce(col, '') not ilike %value%, re ~* and nre coalesce(col, '') !~*. match=any joins the clauses with OR (the event type stays AND).
    evidence:
      - symbol: getRequestFilters
        file: src/lib/request.ts
      - symbol: parseFilterValue
        file: src/lib/params.ts
      - symbol: mapFilter
        file: src/lib/prisma.ts

  - id: "u33"   # class: segments
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "How are saved segments and cohorts applied when I view a website's stats?"
    answer: >
      Both are stored per website (creating one needs website update rights; a cohort needs an
      action type, value and date range and cannot use session property filters). A ?segment=<id>
      merges the stored filters (real filter columns only), session property filters and match
      into the request. A ?cohort=<id> adds cohort_-prefixed filters, its path or event action and
      its own date range; other action types throw an error.
    evidence:
      - symbol: getQueryFilters
        file: src/lib/request.ts
      - symbol: POST
        file: src/app/api/websites/[websiteId]/segments/route.ts

