    question: "How do purchase amounts sent with a custom event end up in the revenue reports?"
    answer: >
      When the event data has a revenue that is a finite number (or numeric string) above 0 and a
      non-empty currency string, a revenue row is written next to the event data (revenue table
      via Prisma, website_revenue in ClickHouse). The collection request is rejected with 400 when
      a currency is given and revenue is 1e14 or more.
