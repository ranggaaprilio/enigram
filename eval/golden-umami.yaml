  # ================================================================ links & pixels
  - id: "u19"   # class: links
    category: behavior
    split: dev
    expected_route: graph_flow
    confidence: high
    question: "What happens when someone opens one of my short links?"
    answer: >
      GET /q/<slug> looks up the link by slug that is not deleted (cached in Redis under
      link:<slug> for 86400 seconds when Redis is enabled) and answers 404 if it is missing or its
      URL is not absolute. Otherwise it builds an "event" payload with the link id, request URL
      and referer, passes it to the /api/send handler (saved as a link event, type 3), and
      redirects to the link's URL whatever the send handler answered.
    evidence:
      - symbol: GET
        file: src/app/(collect)/q/[slug]/route.ts

