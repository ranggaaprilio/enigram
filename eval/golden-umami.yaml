  - id: "u08"   # class: storage
    category: behavior
    split: dev
    expected_route: symbol
    confidence: high
    question: "How does getWebsiteStats decide whether to query Postgres or ClickHouse?"
    answer: >
      It calls runQuery with a Prisma and a ClickHouse variant: when CLICKHOUSE_URL is set the
      ClickHouse query runs; otherwise, if DATABASE_URL is a postgres URL, the relational (Prisma
      raw SQL) query runs. It returns pageviews, visitors, visits, bounces and totaltime.
    evidence:
