  # ================================================================ batch & recordings
  - id: "u24"   # class: collection
    category: behavior
    split: dev
    expected_route: symbol
    confidence: high
    question: "How does POST /api/batch process many tracking payloads at once, and what does it return?"
    answer: >
      It needs no login and accepts a JSON array of at most 500 objects. Each one is replayed in
      order through the /api/send handler as a new request with the original headers. It returns
      size, processed, the number of errors, details (index and response of each failure) and the
