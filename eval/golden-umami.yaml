questions:
  # ================================================================ event collection
  - id: "u01"   # class: collection
    category: behavior
    split: dev
    expected_route: graph_flow
    confidence: high
    question: "What happens when a search engine crawler loads a page that has the tracking script on it?"
    answer: >
      The collection endpoint (POST /api/send) checks the user agent with isbot after reading the
      client info; unless DISABLE_BOT_CHECK is set, a bot gets a 200 JSON reply {beep: "boop"}
      and nothing is saved (no session, no event).
    evidence:
      - symbol: POST
        file: src/app/api/send/route.ts

  - id: "u02"   # class: collection
    category: behavior
    split: dev
    expected_route: graph_flow
    confidence: high
    question: "What does the tracking endpoint answer when a page view is sent for a website that was deleted or never existed?"
    answer: >
      Without a valid cache token for that website, the endpoint looks the website up (from Redis
      under website:<id> when Redis is enabled, else the database); a missing website or one with
      deletedAt set gives 400 Bad Request "Website not found.". A valid x-umami-cache token for
      the same website id skips this lookup, and that token has no expiry, so a client holding
      one keeps sending to a deleted website.
    evidence:
      - symbol: POST
        file: src/app/api/send/route.ts
      - symbol: fetchWebsite
        file: src/lib/load.ts

  - id: "u03"   # class: collection
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "Umami does not use cookies, so how does it decide that two hits come from the same visitor, and when does a new visit start?"
    answer: >
      The session id is a uuid derived from the website (source) id, IP, user agent, a salt and
      the distinct id if given. The salt rotates monthly by default or per SALT_ROTATION (a
      client salt is mixed in only when ENABLE_CLIENT_SALT is set). The visit id is derived from
      the session id and the start of the current hour, so without a cache token a new visit
      starts every clock hour. With a cache token the cached visit is kept until the session
      changes or, for a live (non-historical) hit, more than 1800 seconds passed since its iat.
    evidence:
      - symbol: resolveCollectionSession
        file: src/lib/collection-session.ts
      - symbol: getSalt
        file: src/lib/crypto.ts

  - id: "u04"   # class: ip-filter
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "How can I stop visits from my own office network from being counted?"
    answer: >
      Set IGNORE_IP to a comma-separated list of IP addresses or CIDR ranges. The collection
      endpoint checks the client IP against it (exact match or CIDR match of the same IP family)
      and answers 403 Forbidden without saving anything.
    evidence:
      - symbol: hasBlockedIp
        file: src/lib/detect.ts
      - symbol: POST
        file: src/app/api/send/route.ts

  - id: "u05"   # class: ip-filter
    category: behavior
    split: dev
    expected_route: symbol
    confidence: high
    question: "What does CLIENT_IP_HEADER do, and which IP is used when it is not set?"
    answer: >
      When CLIENT_IP_HEADER is set and that header is present, the visitor IP is read from it.
      Otherwise a fixed list of headers is tried in order (true-client-ip, cf-connecting-ip, ...,
      x-real-ip, x-appengine-user-ip, x-forwarded-for, forwarded, ...), skipping values that are
      trusted proxies from
      TRUSTED_PROXIES; the first non-proxy IP wins, else the first proxy IP seen.
    evidence:
      - symbol: getIpAddress
        file: src/lib/ip.ts

  - id: "u06"   # class: collection
    category: behavior
    split: dev
    expected_route: symbol
    confidence: high
    question: "What is the x-umami-cache header sent to /api/send for?"
    answer: >
      It carries the signed cache token that /api/send returned on the previous hit (type
      "cache", with websiteId, sessionId, visitId, iat). If it verifies against the app secret and
      its websiteId matches, the endpoint skips the website lookup and, on Postgres, skips creating
      the session again, and it reuses the visit; a fresh token is returned in the response.
      The token is a JWT with no expiry.
    evidence:
      - symbol: POST
        file: src/app/api/send/route.ts
      - symbol: resolveCollectionSession
        file: src/lib/collection-session.ts

  # ================================================================ storage split
  - id: "u07"   # class: storage
    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "Where does a tracked event get written: Postgres, ClickHouse or Kafka?"
    answer: >
      If CLICKHOUSE_URL is set the ClickHouse path runs: the event is sent to Kafka topic "event"
      when Kafka is enabled, else inserted into the ClickHouse website_event table. Without
      CLICKHOUSE_URL and with a postgres DATABASE_URL it is written through Prisma.
    evidence:
