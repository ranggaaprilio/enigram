  - id: "u35"   # class: lists
    category: behavior
    split: dev
    expected_route: symbol
    confidence: high
    question: "What do page, pageSize, search and orderBy do on GET /api/websites?"
    answer: >
      search matches name or domain (case-insensitive contains); orderBy is accepted only for
      name, domain or createdAt and otherwise falls back to name; pageSize defaults to 20 and page
      to 1. Deleted websites are excluded; includeTeams adds websites of non-deleted teams the user
      belongs to. The result is {data, count, page, pageSize, orderBy, search}.
    evidence:
