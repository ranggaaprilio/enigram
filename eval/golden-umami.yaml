    category: behavior
    split: dev
    expected_route: semantic
    confidence: high
    question: "Why do my charts never show data from before a certain date even though I picked a longer range?"
    answer: >
      The start date is clamped: never before the website's resetAt, and in CLOUD_MODE for a
      personal (non-team) website whose owner has no subscription, never before the start of the
      month six months ago.
