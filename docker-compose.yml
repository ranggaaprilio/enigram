# Local PostgreSQL with pgvector for STORAGE_BACKEND=postgres. Production uses a managed
# Postgres with the pgvector extension instead (RDS, Cloud SQL, Azure, ...).
#
# `docker compose up -d postgres` runs only the database (for the CLI on the host);
# `docker compose up -d --build` also runs the HTTP API, the index worker and the web UI
# (http://localhost:3000).

x-enigram: &enigram
  build:
    context: . # the uv workspace root
    dockerfile: apps/api/Dockerfile
  image: enigram:local # one image for both services
  env_file: .env
  environment:
    # These override .env, which points at the host.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    DATA_DIR: /app/data
  extra_hosts:
    - "host.docker.internal:host-gateway" # Linux; Docker Desktop already has it
  volumes:
    - ./data:/app/data
    - model-cache:/root/.cache # Docling layout models, Hugging Face downloads, tiktoken
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enigram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DATABASE:-enigram}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    <<: *enigram
    command: ["enigram", "api", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      # API_BIND=0.0.0.0 publishes it on the LAN (for MCP over HTTP); set ENIGRAM_API_KEYS first.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"

  worker:
    <<: *enigram
    # Exactly one, for every workspace: a second one exits ("Another worker is already running").
    command: ["enigram", "worker"]

  web:
    build: ./apps/web
    image: enigram-web:local
    environment:
      # Set: nginx sends it to the API on every /api call (no login; keep WEB_BIND on localhost).
      # Empty with OIDC_ISSUER set: people sign in (docs/rbac.md, R4).
      ENIGRAM_WEB_KEY: ${ENIGRAM_WEB_KEY:-}
      WEB_HOST: ${WEB_HOST:-localhost} # the host name people open, with sign-in
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost} # its origin, e.g. https://enigram.example.com
    ports:
      # WEB_BIND=0.0.0.0 publishes the UI: only with sign-in and ENIGRAM_WEB_KEY empty.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  model-cache:
