# Install once after `uv sync`:  uv run pre-commit install
# Run on every file:             uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Commit messages: `feat:`, `fix(web): …`, etc. (see CONTRIBUTING.md).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Local hooks so ruff and tsc run the versions pinned in uv.lock and web/package-lock.json.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: web-typecheck
        name: tsc (web)
        entry: npm --prefix web run typecheck
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
