# Questions the DecisionProvider answers (domain/decision.py). State keys are quoted with
# backticks in the instructions, as Jev reads them literally; {claim} is filled with the state
# key of one claim. The "true"/"false" criteria keys are quoted so YAML keeps them as strings.
claim_relation:
  type: choice
  instructions: "How does `context` relate to `{claim}`?"
  criteria:
    supports: the context states the claim or directly implies it is true
    contradicts: the context states the opposite of the claim or implies it is false
    says_nothing: the context does not address the claim either way
  threshold: 0.8   # confidence at or above = auto-accepted verdict (citation-check recipe)
answerable:
  type: noul
  # Worded so that a "no, there is none" answer counts when the evidence shows where the thing
  # would have to be. 9 probes on jev-1.14.0, 2026-11-04: absence questions 0.20-0.42 → 0.32-0.57,
  # unanswerable ones 0.04-0.23; 0.25 splits them. Re-measure on the dev split.
  instructions: "`evidence` is enough to answer `question`, including an answer that something is absent."
  criteria:
    "true": the evidence states what the question asks for, or it shows the whole code or text where the asked-for thing would have to appear, so its absence there answers the question
    "false": the asked-for thing could live outside the evidence (configuration, middleware, another module or file), or the evidence only touches related things
  threshold: 0.25  # abstain guard: P(true) at or below this replaces the answer (Jev only); 0 = guard off
note_conflict:
  type: noul
  instructions: "`note` contradicts what `code` does."
  criteria:
    "true": the code does the opposite of what the note says or lacks what it says
    "false": the note agrees with the code or the code does not address it
  threshold: 0.8   # P(true) at or above = conflict; at or below 1 - threshold = no conflict
route:
  type: choice
  # Asked only when the rules in application/routing.py find no route or several. `question` is
  # the user's question, `sources` names what is indexed. memory is not offered (no answer path).
  instructions: "Which source answers `question`, given `sources`?"
  criteria:
    symbol: a named class, function, method, type or constant in the code, or its definition
    graph_flow: what the application does step by step for a request, job or event, including errors and permissions
    semantic: a behaviour of the code described in plain words without naming a route or a symbol
    docs: the content of uploaded documents (papers, books, manuals, specs, design notes) or why something was decided
    annotation: a team note about how the code behaves in production, staging or operations
  # Dev split, jev-latest, 2026-11-04, 5 probes (the questions no single rule decides). Run 1:
  # right 0.51, 0.50, 0.29; wrong 0.42 (b63 -> docs, the wrong source), 0.19. Run 2 (same
  # input): right 0.51, 0.41, 0.34; wrong 0.47 (b63 -> docs), 0.27. The run-to-run spread is
  # wider than the gap, so no threshold separates them reliably. PROVISIONAL until the owner
  # picks the plan's fallback (2-way code/docs choice) or another threshold.
  threshold: 0.45  # confidence below = unsure (answer from code and documents and merge)
entity_symbol_same:
  type: noul
  # The entity <-> symbol bridge (application/doc_conflicts.py): dry runs only, not a gate
  # (owner, 2026-11-04). jev, K=5: eval README docs-vs-code #1 (Email Verified Flag x
  # AuthFacebookService.getProfileByToken) p=0.30, while pairs that only share words scored
  # 0.19-0.36, so no threshold separates them; doc_code_conflict on that pair p=0.84.
  instructions: "`entity` from the documents and `symbol` in the code are about the same thing."
  criteria:
    "true": the symbol is the thing the entity names, or implements the behaviour the entity describes
    "false": they only share words, or the symbol is unrelated to what the entity describes
  threshold: 0.5   # P(true) at or above counts as `linked` in the run report only
doc_code_conflict:
  type: noul
  # Full run 2026-11-04 (nestjs-boilerplate@eval-v1, 42 stored): most were tutorial steps read
  # as claims ("2. Create user.factory.ts") and passages about another driver than the code
  # (s3-presigned upload doc vs the local and s3 controllers). The "false" criteria name both.
  instructions: "`doc` makes a claim about what `code` does, and `code` contradicts it."
  criteria:
    "true": the document describes this code (the same component, endpoint, driver or flow) and the code does the opposite of what it states, or lacks behaviour it says this code has
    "false": the code agrees with the document; or the document describes something else (another driver, module, provider or variant); or the text is a tutorial step, an example, a command or an instruction to the reader (such as "create this file"), not a claim about the existing code
  threshold: 0.8   # P(true) at or above = conflict (as note_conflict)
