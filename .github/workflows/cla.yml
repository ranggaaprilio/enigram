# Blocks merging until every PR author has agreed to CLA.md (see CONTRIBUTING.md).
# Signatures are committed to the unprotected `cla-signatures` branch. The action is archived
# upstream but works; pinned by commit. Fallback: cla-assistant.io with the same CLA.md.
# Never add actions/checkout here: pull_request_target runs with a write token.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/ranggaaprilio/enigram/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ranggaaprilio,dependabot[bot],github-actions[bot]
